# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Control API dependency
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-gateway
          path: cautem-gateway
          ref: 5bbfac55f97199b86cd2077813e605256bb92460

      - name: Configure Go workspace
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/go.work" <<'EOF'
          go 1.27.0

          use (
            .
            ./cautem-gateway
          )

          replace github.com/cautem/cautem-gateway v0.1.6 => ./cautem-gateway
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Control API dependency
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-gateway
          path: cautem-gateway
          ref: 5bbfac55f97199b86cd2077813e605256bb92460

      - name: Configure Go workspace
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/go.work" <<'EOF'
          go 1.27.0

          use (
            .
            ./cautem-gateway
          )

          replace github.com/cautem/cautem-gateway v0.1.6 => ./cautem-gateway
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: .
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Control API dependency
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-gateway
          path: cautem-gateway
          ref: 5bbfac55f97199b86cd2077813e605256bb92460

      - name: Configure Go workspace
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/go.work" <<'EOF'
          go 1.27.0

          use (
            .
            ./cautem-gateway
          )

          replace github.com/cautem/cautem-gateway v0.1.6 => ./cautem-gateway
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: .
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Control API dependency
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-gateway
          path: cautem-gateway
          ref: 5bbfac55f97199b86cd2077813e605256bb92460

      - name: Configure Go workspace
        shell: bash
        run: |
          cat > "$GITHUB_WORKSPACE/go.work" <<'EOF'
          go 1.27.0

          use (
            .
            ./cautem-gateway
          )

          replace github.com/cautem/cautem-gateway v0.1.6 => ./cautem-gateway
          EOF

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./cautem-sdk/coverage.txt
          flags: unittests
          name: codecov-cautem-sdk
          fail_ci_if_error: false
